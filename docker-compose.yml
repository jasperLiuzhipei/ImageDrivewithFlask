services:
  db:
    image: postgres:16
    container_name: webimg-pg
    environment:
      POSTGRES_USER: webimg
      POSTGRES_PASSWORD: webimg
      POSTGRES_DB: webimagedrive
    ports:
      - "5432:5432"
    volumes:
      - ./.docker/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webimg -d webimagedrive || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
